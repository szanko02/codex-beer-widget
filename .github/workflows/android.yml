name: Android
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: bash ./gradlew :core-model:test testDebugUnitTest lintDebug :app:assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
