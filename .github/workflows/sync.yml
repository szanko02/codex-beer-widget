name: Sync protocol and relay
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix protocol
      - run: npm test --prefix protocol
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix sync-server
      - run: npm test --prefix sync-server
