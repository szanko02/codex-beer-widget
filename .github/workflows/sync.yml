name: Sync protocol
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix protocol
      - run: npm test --prefix protocol
